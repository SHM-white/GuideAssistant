name: Release MSIX

on:
  push:
    branches: [master]
    tags:
      - 'v*'
    # Only workflow edits trigger branch smoke tests. Path filters are ignored for tags.
    paths:
      - '.github/workflows/release-msix.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vMAJOR.MINOR.PATCH tag to release'
        required: true
        type: string

permissions:
  contents: read

# Prevent overlapping release attempts for the same tag (including manual reruns).
concurrency:
  group: msix-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Check tag and signing Secrets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            echo 'Smoke test on master: signed MSIX build only; no Release.'
          elif [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Tag must match vMAJOR.MINOR.PATCH.'
            exit 1
          fi
          if [[ "$HAS_CERTIFICATE" != 'true' || "$HAS_PASSWORD" != 'true' ]]; then
            echo '::error::Missing WINDOWS_CERTIFICATE_BASE64 or WINDOWS_CERTIFICATE_PASSWORD. See RELEASE.md.'
            exit 1
          fi
          # Avoid starting three Windows jobs for an absent release tag.
          if [[ "$GITHUB_REF_TYPE" != "branch" ]] && ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag '${RELEASE_TAG}' does not exist."
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify released commit and version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "::error::The release tag must reference a commit merged into master."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            python scripts/verify_release_version.py
          else
            python scripts/verify_release_version.py --tag "$RELEASE_TAG"
          fi

  build:
    needs: preflight
    name: Build ${{ matrix.architecture }} MSIX
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            runtimeIdentifier: win-x86
            appxBundlePlatform: x86
          - architecture: x64
            runtimeIdentifier: win-x64
            appxBundlePlatform: x64
          - architecture: ARM64
            runtimeIdentifier: win-arm64
            appxBundlePlatform: arm64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag and derive MSIX version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          # On master pushes use the project version for filenames, not "master".
          $tag = $env:REQUESTED_TAG.Trim()
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            $projectFile = Join-Path $env:GITHUB_WORKSPACE 'GuideAssistant\GuideAssistant.csproj'
            [xml]$projectXml = Get-Content -LiteralPath $projectFile
            $projectVersion = @($projectXml.Project.PropertyGroup | ForEach-Object { $_.Version } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)[0]
            if ([string]::IsNullOrWhiteSpace($projectVersion)) {
              throw 'Missing project version for master packaging smoke test.'
            }
            $tag = "v$projectVersion"
            Write-Host "Packaging smoke test for $tag. This run cannot publish a Release."
          }
          if ($tag -match '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3]
          } else {
            throw "Tag '$tag' must strictly match vMAJOR.MINOR.PATCH."
          }

          foreach ($component in @($major, $minor, $patch)) {
            if ($component -gt 65535) {
              throw "MSIX version component '$component' exceeds 65535."
            }
          }

          if ($env:GITHUB_REF_TYPE -ne 'branch') {
            git fetch --force --tags origin
            $null = git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0) {
              throw "Tag '$tag' does not exist in this repository."
            }
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSIX_VERSION=$major.$minor.$patch.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rewrite runner manifest version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'GuideAssistant'
          $manifests = @(Get-ChildItem -Path $projectDir -Filter '*.appxmanifest' -Recurse -File)
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one appxmanifest under '$projectDir', found $($manifests.Count)."
          }

          $manifestPath = $manifests[0].FullName
          [xml]$manifest = Get-Content -LiteralPath $manifestPath
          $identity = $manifest.Package.Identity
          if ($null -eq $identity) {
            throw "Manifest '$manifestPath' does not contain Package/Identity."
          }

          $publisher = [string]$identity.Publisher
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            throw "Manifest '$manifestPath' does not declare an Identity Publisher."
          }

          $identity.Version = $env:MSIX_VERSION
          $manifest.Save($manifestPath)

          "MANIFEST_PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MANIFEST_PUBLISHER=$publisher" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import signing certificate (no Root trust)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_BASE64 secret is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD secret is required.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'windows-signing-certificate.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))

          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable)
          $signingCertificate = $importedCertificates |
            Where-Object { $_.HasPrivateKey -and $_.Subject -eq $env:MANIFEST_PUBLISHER } |
            Select-Object -First 1

          if ($null -eq $signingCertificate) {
            throw "PFX must contain a private-key certificate whose Subject exactly matches manifest Publisher '$env:MANIFEST_PUBLISHER'."
          }
          if (-not $signingCertificate.HasPrivateKey) {
            throw 'Imported signing certificate does not have a private key.'
          }
          if ($signingCertificate.Subject -ne $env:MANIFEST_PUBLISHER) {
            throw "Certificate Subject '$($signingCertificate.Subject)' does not exactly match manifest Publisher '$env:MANIFEST_PUBLISHER'."
          }

          # Writing a self-signed certificate to Root can show an interactive
          # trust prompt and hang a headless runner (the previous run hit 6 hours).
          # We verify the signature and exact signer instead, without adding a root.
          if ($signingCertificate.Subject -eq $signingCertificate.Issuer) {
            Write-Host 'Self-signed publisher: do not elevate trust to a root CA in CI.'
          }

          "CERT_THUMBPRINT=$($signingCertificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CERT_THUMBPRINT_TO_CLEAN=$($signingCertificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere was not found at '$vswhere'."
          }

          $msbuildPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuildPath) -or -not (Test-Path -LiteralPath $msbuildPath)) {
            throw 'MSBuild could not be resolved with vswhere.'
          }

          "MSBUILD_PATH=$msbuildPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed side-load package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'GuideAssistant\GuideAssistant.csproj'
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\msix\${{ matrix.architecture }}'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          & $env:MSBUILD_PATH $projectPath `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.architecture }} `
            /p:RuntimeIdentifier=${{ matrix.runtimeIdentifier }} `
            /p:PublishProfile= `
            /p:AppxBundle=Never `
            /p:AppxBundlePlatforms=${{ matrix.appxBundlePlatform }} `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT `
            /p:AppxPackageVersion=$env:MSIX_VERSION `
            /p:Version=$env:MSIX_VERSION `
            /p:AppxPackageDir="$packageRoot\"

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Verify package and create ZIP asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\msix\${{ matrix.architecture }}'
          $sideLoadDirs = @(Get-ChildItem -Path $packageRoot -Directory -Recurse | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.FullName 'Add-AppDevPackage.ps1')
          })
          if ($sideLoadDirs.Count -ne 1) {
            throw "Expected exactly one side-load directory with Add-AppDevPackage.ps1 under '$packageRoot', found $($sideLoadDirs.Count)."
          }

          $sideLoadDir = $sideLoadDirs[0]
          # A side-load directory normally also contains .msix dependencies
          # (for example Windows App SDK packages). Do not count those as
          # additional copies of the GuideAssistant application.
          $expectedMainPackage = "GuideAssistant_$($env:MSIX_VERSION)_${{ matrix.appxBundlePlatform }}.msix"
          $mainPackagePath = Join-Path $sideLoadDir.FullName $expectedMainPackage
          if (-not (Test-Path -LiteralPath $mainPackagePath -PathType Leaf)) {
            $availableMsix = @(Get-ChildItem -LiteralPath $sideLoadDir.FullName -Filter '*.msix' -Recurse -File |
              Select-Object -ExpandProperty FullName)
            throw "Main application MSIX '$expectedMainPackage' not found in '$($sideLoadDir.FullName)'. Found: $($availableMsix -join ', ')"
          }
          Write-Host "Verifying primary MSIX '$mainPackagePath'; any dependency MSIX packages remain in the side-load ZIP."

          $signTools = @(Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter 'signtool.exe' -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object @{ Expression = { [version]$_.Directory.Parent.Name }; Descending = $true })
          if ($signTools.Count -eq 0) {
            throw 'Latest x64 signtool.exe could not be found in the Windows 10 SDK.'
          }

          $signtoolPath = $signTools[0].FullName
          # The signed package is not a trusted publisher on a clean runner.
          # Distinguish this expected self-signed trust failure from a bad hash,
          # missing signature or unexpected signing identity.
          $signature = Get-AuthenticodeSignature -LiteralPath $mainPackagePath
          if ($null -eq $signature.SignerCertificate) {
            throw "MSIX has no readable signing certificate (status: $($signature.Status))."
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:CERT_THUMBPRINT) {
            throw 'MSIX signer thumbprint differs from the PFX imported for this build.'
          }
          # The self-signed publisher returns UnknownError with CERT_E_UNTRUSTEDROOT
          # on Windows Server runners (not always the NotTrusted enum). Never
          # accept unrelated UnknownError statuses, mismatched signer or hash errors.
          $untrustedSelfSignedRoot = ($signature.Status -in @('NotTrusted', 'UnknownError')) -and
            ($signature.StatusMessage -match '(?i)root\s+certificate\s+which\s+is\s+not\s+trusted|0x800B0109') -and
            ($signature.SignerCertificate.Subject -eq $signature.SignerCertificate.Issuer)

          if ($signature.Status -ne 'Valid' -and -not $untrustedSelfSignedRoot) {
            throw "MSIX Authenticode signature invalid: $($signature.Status). $($signature.StatusMessage)"
          }

          # Independently check the embedded CMS signature without trusting its
          # certificate chain. AppxSignature.p7x begins with the four-byte PKCX
          # header, followed by DER PKCS#7 SignedData.
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          Add-Type -AssemblyName System.Security.Cryptography.Pkcs
          $archive = [System.IO.Compression.ZipFile]::OpenRead($mainPackagePath)
          try {
            $entry = $archive.GetEntry('AppxSignature.p7x')
            if ($null -eq $entry) { throw 'MSIX is missing AppxSignature.p7x.' }
            $entryStream = $entry.Open()
            $memory = [System.IO.MemoryStream]::new()
            try {
              $entryStream.CopyTo($memory)
              $p7x = $memory.ToArray()
            } finally {
              $entryStream.Dispose()
              $memory.Dispose()
            }
          } finally {
            $archive.Dispose()
          }
          if ($p7x.Length -le 4 -or [Text.Encoding]::ASCII.GetString($p7x, 0, 4) -ne 'PKCX') {
            throw 'MSIX signature header is missing or invalid.'
          }
          $der = New-Object byte[] ($p7x.Length - 4)
          [Array]::Copy($p7x, 4, $der, 0, $der.Length)
          $signedCms = [System.Security.Cryptography.Pkcs.SignedCms]::new()
          $signedCms.Decode($der)
          $signedCms.CheckSignature($true)
          if ($signedCms.SignerInfos.Count -ne 1 -or
              $null -eq $signedCms.SignerInfos[0].Certificate -or
              $signedCms.SignerInfos[0].Certificate.Thumbprint -ne $env:CERT_THUMBPRINT) {
            throw 'MSIX PKCS#7 signer does not match the imported build certificate.'
          }
          Write-Host 'MSIX embedded PKCS#7 cryptographic signature passed, and its signer matches the PFX.'

          if ($signature.Status -eq 'Valid') {
            & $signtoolPath verify /pa /all /v $mainPackagePath
            if ($LASTEXITCODE -ne 0) {
              throw "Trusted SignTool verification failed (code $LASTEXITCODE)."
            }
          } else {
            Write-Warning 'Expected self-signed untrusted-root status. The signed package is NOT automatically trusted on users devices; install only after explicit certificate trust.'
          }
          Write-Host "Signature status=$($signature.Status); signer=$($signature.SignerCertificate.Thumbprint)"

          $assetDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          $zipPath = Join-Path $assetDir "GuideAssistant-$env:RELEASE_TAG-${{ matrix.architecture }}.zip"
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path $sideLoadDir.FullName -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload ${{ matrix.architecture }} ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.architecture }}
          path: artifacts/release/*.zip
          if-no-files-found: error

      - name: Clean signing certificate and PFX
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          if (-not [string]::IsNullOrWhiteSpace($env:CERT_THUMBPRINT_TO_CLEAN)) {
            $certPath = "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT_TO_CLEAN"
            if (Test-Path -LiteralPath $certPath) {
              try {
                Remove-Item -LiteralPath $certPath -DeleteKey -Force
              } catch {
                Remove-Item -LiteralPath $certPath -Force
              }
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($env:PFX_PATH) -and (Test-Path -LiteralPath $env:PFX_PATH)) {
            Remove-Item -LiteralPath $env:PFX_PATH -Force
          }
          # No trust anchors were added by this job.

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Master smoke runs must never create or change a GitHub Release.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    permissions:
      contents: write
    steps:
      - name: Resolve and validate release tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_TAG}"
          if [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Tag '${tag}' must strictly match vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          for component in "${major}" "${minor}" "${patch}"; do
            if (( component > 65535 )); then
              echo "MSIX version component '${component}' exceeds 65535." >&2
              exit 1
            fi
          done

          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: msix-*
          path: release-assets
          merge-multiple: true

      - name: Require exactly expected ZIP assets
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            "GuideAssistant-${RELEASE_TAG}-x86.zip"
            "GuideAssistant-${RELEASE_TAG}-x64.zip"
            "GuideAssistant-${RELEASE_TAG}-ARM64.zip"
          )

          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          if [[ "${#actual[@]}" -ne 3 ]]; then
            printf 'Expected exactly 3 ZIP assets, found %s:\n' "${#actual[@]}" >&2
            printf '  %s\n' "${actual[@]}" >&2
            exit 1
          fi

          for expected_name in "${expected[@]}"; do
            if [[ ! -f "release-assets/${expected_name}" ]]; then
              echo "Missing expected asset '${expected_name}'." >&2
              exit 1
            fi
          done

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum "GuideAssistant-${RELEASE_TAG}-x86.zip" \
                    "GuideAssistant-${RELEASE_TAG}-x64.zip" \
                    "GuideAssistant-${RELEASE_TAG}-ARM64.zip" > SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Reusing existing release ${RELEASE_TAG}."
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi

          gh release upload "${RELEASE_TAG}" \
            "release-assets/GuideAssistant-${RELEASE_TAG}-x86.zip" \
            "release-assets/GuideAssistant-${RELEASE_TAG}-x64.zip" \
            "release-assets/GuideAssistant-${RELEASE_TAG}-ARM64.zip" \
            "release-assets/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
